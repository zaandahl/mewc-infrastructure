name: Validate private infrastructure
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked tools and application test dependencies
        run: |
          python -m pip install uv==0.11.6
          uv venv --python 3.12
          uv pip sync --python .venv/bin/python requirements-dev.txt
          .venv/bin/ansible-galaxy collection install -r ansible-requirements.yml
      - name: Unit and contract tests
        run: .venv/bin/python -m pytest -q
      - name: Syntax and static checks
        run: |
          .venv/bin/python -m compileall -q mewc_infra playbooks/files cpu-mewc-web/roles/mewc_web/files/app/app
          .venv/bin/ruff check mewc_infra playbooks/files cpu-mewc-web/roles/mewc_web/files/app/app
          shellcheck create_keypair.sh gpu/*.sh gpu-complex/*.sh cpu-rstudio/*.sh cpu-mewc-web/*.sh cpu-mewc-web/roles/mewc_web/files/app/bin/*.sh
          .venv/bin/ansible-playbook --syntax-check -i localhost, playbooks/site.yml
          .venv/bin/ansible-playbook --syntax-check -i localhost, cpu-mewc-web/web_site.yml
          .venv/bin/ansible-lint --profile production playbooks/site.yml cpu-mewc-web/web_site.yml
          git diff --check
      - name: Audit locked Python runtime dependencies
        run: |
          .venv/bin/pip-audit --disable-pip --no-deps -r requirements-controller.txt
          .venv/bin/pip-audit --disable-pip --no-deps -r cpu-mewc-web/roles/mewc_web/files/app/requirements.txt
      - name: Build the controller and validate its provider schema
        run: |
          docker build --pull --tag mewc-controller:test .
          docker run --rm -v "$PWD:/app:ro" mewc-controller:test bash -euc '
            export TF_DATA_DIR=/tmp/terraform-data
            terraform -chdir=infra/compute init -backend=false -input=false -lockfile=readonly
            terraform -chdir=infra/compute fmt -check
            terraform -chdir=infra/compute validate
            python -m mewc_infra --help
          '
