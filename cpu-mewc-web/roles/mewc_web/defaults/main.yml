---
mount_point: /mnt/mewc-volume
app_root: /opt/mewc-web
venv_dir: /opt/mewc-web/venv
bind_host: 127.0.0.1
bind_port: 8000
web_proxy_port: 8080
max_upload_mb: 512
max_expanded_mb: 2048
max_files: 10000
reserve_mb: 2048
# Required operator choice. Synthetic fallback and floating tags are forbidden.
detect_image: ""
detect_model: ""
detect_cpus: 4
detect_memory: 8g
detect_timeout_seconds: 21600
detect_confidence: 0.30
detect_gpus: ""
