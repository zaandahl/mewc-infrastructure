---
- name: Install Ubuntu-supported container runtimes without starting them on root storage
  hosts: all
  become: true
  tasks:
    - name: Require verified mounted storage before package changes
      ansible.builtin.command: /usr/local/sbin/mewc-storage-check
      changed_when: false

    - name: Install distribution runtime and Python SDK packages
      ansible.builtin.apt:
        name:
          - "docker.io{{ '=' + mewc_docker_package_version if mewc_docker_package_version is defined else '' }}"
          - "containerd{{ '=' + mewc_containerd_package_version if mewc_containerd_package_version is defined else '' }}"
          - python3-docker
          - ca-certificates
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600
        policy_rc_d: 101
        install_recommends: false

    - name: Record actual distribution runtime versions for reproducibility
      ansible.builtin.command:
        argv: [dpkg-query, --show, '--showformat=${Package}=${Version}\n', docker.io, containerd, python3-docker]
      register: mewc_host_package_versions
      changed_when: false

    - name: Persist the installed runtime package manifest
      ansible.builtin.copy:
        dest: /etc/mewc-host-packages.txt
        content: "{{ mewc_host_package_versions.stdout }}\n"
        owner: root
        group: root
        mode: '0644'
