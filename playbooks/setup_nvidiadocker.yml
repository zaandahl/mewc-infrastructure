---
- name: Integrate the preinstalled Nectar NVIDIA driver with Docker
  hosts: all
  become: true
  vars:
    mewc_nvidia_toolkit_version: 1.20.0-1
  tasks:
    # No NVIDIA driver/CUDA packages: Nectar vGPU licensing belongs to the image.
    - name: Require the image's functioning NVIDIA driver
      ansible.builtin.command: nvidia-smi --query-gpu=driver_version,name --format=csv,noheader
      changed_when: false

    - name: Verify storage before toolkit changes
      ansible.builtin.command: /usr/local/sbin/mewc-storage-check
      changed_when: false

    - name: Install the pinned NVIDIA repository signing key
      ansible.builtin.get_url:
        url: https://nvidia.github.io/libnvidia-container/gpgkey
        dest: /usr/share/keyrings/nvidia-container-toolkit.asc
        checksum: sha256:c880576d6cf75a48e5027a871bac70fd0421ab07d2b55f30877b21f1c87959c9
        owner: root
        group: root
        mode: '0644'

    - name: Configure the current signed NVIDIA production repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
        owner: root
        group: root
        mode: '0644'
        content: |
          deb [arch=amd64 signed-by=/usr/share/keyrings/nvidia-container-toolkit.asc] https://nvidia.github.io/libnvidia-container/stable/deb/amd64 /
      notify: Refresh NVIDIA package metadata

    - name: Refresh changed repository metadata before toolkit installation
      ansible.builtin.meta: flush_handlers

    - name: Install the complete pinned toolkit without replacing the image driver
      ansible.builtin.apt:
        name:
          - 'nvidia-container-toolkit={{ mewc_nvidia_toolkit_version }}'
          - 'nvidia-container-toolkit-base={{ mewc_nvidia_toolkit_version }}'
          - 'libnvidia-container-tools={{ mewc_nvidia_toolkit_version }}'
          - 'libnvidia-container1={{ mewc_nvidia_toolkit_version }}'
        state: present
        policy_rc_d: 101
        install_recommends: false

    - name: Read current Docker configuration
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: mewc_gpu_daemon

    - name: Configure NVIDIA runtime only when missing or incorrect
      when: >-
        ((mewc_gpu_daemon.content | b64decode | from_json).get('runtimes', {}).get('nvidia', {}).get('path', ''))
        not in ['nvidia-container-runtime', '/usr/bin/nvidia-container-runtime']
      block:
        - name: Check for active workloads before changing the GPU runtime
          ansible.builtin.command: docker ps --quiet
          register: mewc_gpu_running_containers
          changed_when: false
        - name: Require idle Docker for GPU integration
          ansible.builtin.assert:
            that: mewc_gpu_running_containers.stdout | trim == ''
            fail_msg: Stop active containers explicitly before GPU runtime reconfiguration.
        - name: Configure NVIDIA with the supported toolkit command
          ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
          changed_when: true
        - name: Validate the resulting Docker configuration
          ansible.builtin.command: dockerd --validate --config-file=/etc/docker/daemon.json
          changed_when: false
        - name: Restart Docker after the actual runtime configuration change
          ansible.builtin.systemd_service:
            name: docker.service
            state: restarted

    - name: Verify the installed NVIDIA runtime registration
      ansible.builtin.command:
        argv: [docker, info, --format, '{{ "{{json .Runtimes}}" }}']
      register: mewc_gpu_runtime_info
      changed_when: false
      failed_when: "'nvidia' not in (mewc_gpu_runtime_info.stdout | from_json)"

    # Actual GPU inference is a release validation, using a digest/model selected
    # explicitly by the operator. nvidia-smi alone is not inference evidence.

  handlers:
    - name: Refresh NVIDIA package metadata
      ansible.builtin.apt:
        update_cache: true
