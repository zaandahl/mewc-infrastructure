---
# Optional legacy feature, deliberately excluded from the supported site.yml.
- name: Require a separately reviewed PowerShell installation
  hosts: all
  gather_facts: false
  tasks:
    - name: Explain the optional feature boundary
      ansible.builtin.fail:
        msg: >-
          PowerShell is not part of the supported MEWC host setup. Install a pinned,
          reviewed distribution-specific package separately if this legacy feature is required.
